# ============================================================================
# One Window Bayanihan — Docker Compose
#
# USAGE:
#   Build and start:        docker compose up -d
#   Run migrations:         docker compose exec app php artisan migrate
#   Seed database:          docker compose exec app php artisan db:seed
#   View logs:              docker compose logs -f
#   Rebuild after changes:  docker compose build --no-cache app
#
# PRODUCTION:
#   Set .env with your production values (Supabase, Storage, Pusher, etc.)
#   Run: docker compose up -d
#   The local PostgreSQL can be disabled by setting DB_HOST to your Supabase host
# ============================================================================

# Shared fragments (ignored by Compose — `x-` prefix). Anchors dedupe the four
# PHP services (app/queue/scheduler/migrate); aliases below are byte-equivalent
# to the previously inlined blocks.
x-common:
  build: &php-build
    context: .
    dockerfile: Dockerfile
    target: app
  env-file: &php-env-file
    - .env
  # Full env (app + migrate include APP_URL).
  env-app: &php-env-app
    - APP_ENV=${APP_ENV:-production}
    - APP_DEBUG=${APP_DEBUG:-false}
    - APP_URL=${APP_URL:-http://localhost}
    - DB_HOST=${DB_HOST:-db}
    - DB_PORT=${DB_PORT:-5432}
    - DB_DATABASE=${DB_DATABASE:-one_window}
    - DB_USERNAME=${DB_USERNAME:-postgres}
    - DB_PASSWORD=${DB_PASSWORD:-secret}
    - REDIS_HOST=${REDIS_HOST:-redis}
    - CACHE_STORE=${CACHE_STORE:-redis}
    - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
    - SESSION_DRIVER=${SESSION_DRIVER:-database}
    - FILESYSTEM_DISK=${FILESYSTEM_DISK:-object-storage}
    # R2 overrides — set FILESYSTEM_DISK=r2 to activate
    - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
    - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
    - R2_BUCKET=${R2_BUCKET:-}
    - R2_ENDPOINT=${R2_ENDPOINT:-}
    - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
  # Worker env (queue + scheduler omit APP_URL, as before).
  env-worker: &php-env-worker
    - APP_ENV=${APP_ENV:-production}
    - APP_DEBUG=${APP_DEBUG:-false}
    - DB_HOST=${DB_HOST:-db}
    - DB_PORT=${DB_PORT:-5432}
    - DB_DATABASE=${DB_DATABASE:-one_window}
    - DB_USERNAME=${DB_USERNAME:-postgres}
    - DB_PASSWORD=${DB_PASSWORD:-secret}
    - REDIS_HOST=${REDIS_HOST:-redis}
    - CACHE_STORE=${CACHE_STORE:-redis}
    - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
    - SESSION_DRIVER=${SESSION_DRIVER:-database}
    - FILESYSTEM_DISK=${FILESYSTEM_DISK:-object-storage}
    # R2 overrides — set FILESYSTEM_DISK=r2 to activate
    - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
    - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
    - R2_BUCKET=${R2_BUCKET:-}
    - R2_ENDPOINT=${R2_ENDPOINT:-}
    - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
  depends: &php-depends
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  security-opt: &php-security-opt
    - no-new-privileges:true
  cap-drop: &php-cap-drop
    - ALL
  cap-add: &php-cap-add
    - FOWNER
    - SETGID
    - SETUID
  deploy: &php-deploy
    resources:
      limits:
        cpus: '1'
        memory: 512M
      reservations:
        cpus: '0.25'
        memory: 128M
  logging: &default-logging
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  network: &default-network
    - app-network

services:
  # ── Nginx Web Server ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-80}:80"
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      # Nginx configuration
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Custom entrypoint for envsubst support
      - ./docker/nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks: *default-network

  # ── PHP-FPM Application ──────────────────────────────────────────────────
  app:
    build: *php-build
    env_file: *php-env-file
    environment: *php-env-app
    security_opt: *php-security-opt
    cap_drop: *php-cap-drop
    cap_add: *php-cap-add
    depends_on: *php-depends
    restart: unless-stopped
    deploy: *php-deploy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://nginx/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks: *default-network

  # ── Queue Worker ──────────────────────────────────────────────────────────
  queue:
    build: *php-build
    env_file: *php-env-file
    environment: *php-env-worker
    security_opt: *php-security-opt
    cap_drop: *php-cap-drop
    cap_add: *php-cap-add
    depends_on: *php-depends
    restart: unless-stopped
    deploy: *php-deploy
    command: php artisan queue:listen --tries=3 --timeout=90
    logging: *default-logging
    networks: *default-network

  # ── Scheduler ─────────────────────────────────────────────────────────────
  scheduler:
    build: *php-build
    env_file: *php-env-file
    environment: *php-env-worker
    security_opt: *php-security-opt
    cap_drop: *php-cap-drop
    cap_add: *php-cap-add
    depends_on: *php-depends
    restart: unless-stopped
    deploy: *php-deploy
    command: php artisan schedule:work
    logging: *default-logging
    networks: *default-network

  # ── Migration Runner (one-shot, profile-based) ───────────────────────────
  migrate:
    build: *php-build
    env_file: *php-env-file
    environment: *php-env-app
    depends_on: *php-depends
    command: php artisan migrate --force --no-interaction
    networks: *default-network
    profiles:
      - migrate
    logging: *default-logging

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  # For local development. In production, point DB_HOST to your Supabase host.
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-one_window}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    # ports:
    #   - "${DB_EXPOSE_PORT:-5432}:5432"  # exposed only when DB_EXPOSE_PORT is explicitly set
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-one_window}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks: *default-network

  # ── Redis ─────────────────────────────────────────────────────────────────
  # In-memory store for cache, queue, and sessions.
  # Provides ~30x faster OTP handling and eliminates database queue polling.
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
    # ports:
    #   - "${REDIS_EXPOSE_PORT:-6379}:6379"  # exposed only when REDIS_EXPOSE_PORT is explicitly set
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging: *default-logging
    networks: *default-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
