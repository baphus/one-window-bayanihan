# ============================================================================
# One Window Bayanihan — Docker Compose
#
# USAGE:
#   Build and start:        docker compose up -d
#   Run migrations:         docker compose exec app php artisan migrate
#   Seed database:          docker compose exec app php artisan db:seed
#   View logs:              docker compose logs -f
#   Rebuild after changes:  docker compose build --no-cache app
#
# PRODUCTION:
#   Set .env with your production values (Supabase, Storage, Pusher, etc.)
#   Run: docker compose up -d
#   The local PostgreSQL can be disabled by setting DB_HOST to your Supabase host
# ============================================================================

# Shared environment for the four PHP services (app, queue, scheduler,
# migrate), defined once and aliased below. APP_URL is included for all four:
# it is only read where URLs are generated, so sharing it keeps one list
# instead of two near-identical anchors drifting out of sync.
x-app-env: &app-env
  - APP_ENV=${APP_ENV:-production}
  - APP_DEBUG=${APP_DEBUG:-false}
  - APP_URL=${APP_URL:-http://localhost}
  - DB_HOST=${DB_HOST:-db}
  - DB_PORT=${DB_PORT:-5432}
  - DB_DATABASE=${DB_DATABASE:-one_window}
  - DB_USERNAME=${DB_USERNAME:-postgres}
  - DB_PASSWORD=${DB_PASSWORD:-secret}
  - REDIS_HOST=${REDIS_HOST:-redis}
  - CACHE_STORE=${CACHE_STORE:-redis}
  - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
  - SESSION_DRIVER=${SESSION_DRIVER:-database}
  - FILESYSTEM_DISK=${FILESYSTEM_DISK:-object-storage}
  # R2 overrides - set FILESYSTEM_DISK=r2 to activate
  - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
  - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
  - R2_BUCKET=${R2_BUCKET:-}
  - R2_ENDPOINT=${R2_ENDPOINT:-}
  - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
  # Single web/worker layer: the app image serves HTTP via its baked nginx on
  # 8080, and the dedicated queue/scheduler services below cover background
  # work. Only the app service runs supervisord (the others override the
  # command), so disabling both here affects it alone and removes the
  # duplicate worker/scheduler the baked supervisor would otherwise start.
  - RUN_QUEUE_WORKER=${RUN_QUEUE_WORKER:-false}
  - RUN_SCHEDULER=${RUN_SCHEDULER:-false}

# Shared build + runtime for the four PHP services (app, queue, scheduler,
# migrate), defined once and merged below. migrate uses only php-base: it is
# a one-shot runner, so it must NOT inherit restart/deploy from php-hardened
# (restarting an exited-zero one-shot would loop it).
x-php-base: &php-base
  build:
    context: .
    dockerfile: Dockerfile
    target: app
  env_file:
    - .env
  environment: *app-env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - app-network

# Long-lived hardening for app/queue/scheduler only (not migrate).
x-php-hardened: &php-hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - FOWNER
    - SETGID
    - SETUID
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 512M
      reservations:
        cpus: '0.25'
        memory: 128M

services:
  # ── PHP-FPM Application (baked nginx on 8080 — the single web layer) ──────
  app:
    <<: [*php-base, *php-hardened]
    ports:
      - "${APP_PORT:-80}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Queue Worker ──────────────────────────────────────────────────────────
  queue:
    <<: [*php-base, *php-hardened]
    command: php artisan queue:listen --tries=3 --timeout=90

  # ── Scheduler ─────────────────────────────────────────────────────────────
  scheduler:
    <<: [*php-base, *php-hardened]
    command: php artisan schedule:work

  # ── Migration Runner (one-shot, profile-based) ───────────────────────────
  migrate:
    <<: *php-base
    command: php artisan migrate --force --no-interaction
    profiles:
      - migrate

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  # For local development. In production, point DB_HOST to your Supabase host.
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-one_window}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    # ports:
    #   - "${DB_EXPOSE_PORT:-5432}:5432"  # exposed only when DB_EXPOSE_PORT is explicitly set
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-one_window}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # ── Redis ─────────────────────────────────────────────────────────────────
  # In-memory store for cache, queue, and sessions.
  # Provides ~30x faster OTP handling and eliminates database queue polling.
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
    # ports:
    #   - "${REDIS_EXPOSE_PORT:-6379}:6379"  # exposed only when REDIS_EXPOSE_PORT is explicitly set
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
