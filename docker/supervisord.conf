[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Queue worker ───────────────────────────────────────────────────────────────
; --timeout=320 bounds how long a single job may run. It must stay ABOVE the
; longest per-job timeout any job declares, or the worker kills jobs that were
; within their own budget: GenerateSystemReport runs PDF/export generation with
; public int $timeout = 300, so a 30s (or Laravel's 60s default) worker timeout
; killed every non-trivial export mid-write. The 20s slack lets Laravel's own
; pcntl alarm fire first so the job is released back to the queue as a normal
; timeout instead of being SIGKILLed by the worker.
; stopwaitsecs is set above the job timeout so supervisor lets an in-flight job
; finish before escalating.
;
; RUN_QUEUE_WORKER=false disables it in-place, so a dedicated worker service can
; be split out later without rebuilding the image.
[program:queue-worker]
command=/bin/sh -c 'if [ "${RUN_QUEUE_WORKER:-true}" = "true" ]; then exec php /var/www/html/artisan queue:work --queue=default,notifications,heavy --sleep=3 --tries=3 --timeout=320 --max-jobs=500 --max-time=3600; else echo "[SUPERVISOR] queue-worker disabled (RUN_QUEUE_WORKER=false)"; exec sleep infinity; fi'
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=340
; Start after nginx and php-fpm are ready
startsecs=10

; ── Scheduler ──────────────────────────────────────────────────────────────────
; MUST run on exactly ONE instance. This process lives in the web container, so
; running the service at scale > 1 double-runs every scheduled job — retention
; and audit archiving included, which corrupts retention evidence rather than
; merely duplicating work.
;
; To scale the web tier horizontally: set RUN_SCHEDULER=false on the web service
; and run a second, single-instance service from the same image with
; RUN_SCHEDULER=true and RUN_QUEUE_WORKER=false.
[program:scheduler]
command=/bin/sh -c 'if [ "${RUN_SCHEDULER:-true}" = "true" ]; then exec php /var/www/html/artisan schedule:work; else echo "[SUPERVISOR] scheduler disabled (RUN_SCHEDULER=false)"; exec sleep infinity; fi'
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=35
; Start after queue worker is running
startsecs=15
