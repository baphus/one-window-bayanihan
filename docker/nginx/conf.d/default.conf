# Restore the real client IP from X-Forwarded-For for platforms whose load
# balancer reaches the container from a private address. Managed container
# platforms do not all publish that range, so this may legitimately not match —
# see $client_addr below for the range-independent path.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ── Client address resolution (security-relevant — read before changing) ───────
#
# X-Forwarded-For is a client-supplied header. A load balancer APPENDS the peer
# address it observed, so on a request that arrives as
#
#     X-Forwarded-For: 203.0.113.9          (attacker-chosen)
#
# the platform LB rewrites it to
#
#     X-Forwarded-For: 203.0.113.9, <attacker real IP>
#
# Laravel is configured with trustProxies(at: '*') (bootstrap/app.php), which
# trusts every hop and therefore resolves the client to the LEFT-MOST entry —
# the attacker-chosen one. That silently defeats:
#   * login and API rate limiting (RateLimiter keys on the resolved IP),
#   * the IpWhitelist middleware,
#   * the client IP recorded in audit records via LogContext.
# The container's own platform URL stays publicly reachable even when a CDN sits
# in front of the custom domain, so this is reachable in practice.
#
# Fix: hand PHP only the RIGHT-MOST entry — the address the platform's own load
# balancer observed and appended. Anything the client supplied is discarded.
# This is deliberately independent of the LB's IP range, which is unpublished.
#
# Failure mode if the platform does NOT set X-Forwarded-For: the value is empty,
# Laravel falls back to REMOTE_ADDR (the LB), and every client collapses to one
# bucket. Degraded, but NOT spoofable. Verify after any platform change with the
# procedure in the deployment runbook (§ "Verify client IP resolution").
map $http_x_forwarded_for $client_addr {
    # Two or more hops: take the last, which the platform LB appended.
    "~,\s*(?<lastaddr>[^,\s]+)\s*$"  $lastaddr;
    # Exactly one hop (or none): the platform LB's own value, or empty.
    default                          $http_x_forwarded_for;
}

# Rate limiting zone — 100 requests per minute per resolved client IP.
# Keyed on $client_addr rather than $binary_remote_addr so the limit tracks the
# same address Laravel sees. An empty key (no XFF, e.g. an internal health check)
# is skipped by nginx and therefore not rate limited.
limit_req_zone $client_addr zone=app:10m rate=100r/m;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    # Security headers (CSP omitted — handled by Laravel middleware for flexibility)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Static assets — immutable cache for versioned build files
    location /build/ {
        alias /var/www/html/public/build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Favicon / robots
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Static files
    location ~* \.(?:js|css|map|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|eot|ttf|otf)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM (local — same container)
    location / {
        limit_req zone=app burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
        fastcgi_send_timeout 60;

        # Response headers here exceed nginx's default 4k/8k FastCGI buffer:
        # Laravel emits a long Content-Security-Policy (see the CSP note above)
        # alongside Set-Cookie for the session, remember-me, and XSRF token.
        # When the header block overflows, nginx aborts the upstream response with
        #   "upstream sent too big header while reading response header from upstream"
        # and returns 502 — which also breaks the session cookie round-trip, so
        # subsequent XHRs 302 to login and the page never recovers.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;

        include fastcgi_params;

        # Laravel trusted proxies — trust the platform load balancer.
        # $client_addr (defined at the top of this file) collapses the chain to the
        # single address the platform LB observed, so a client-supplied
        # X-Forwarded-For cannot influence the IP Laravel resolves. Do NOT restore
        # $proxy_add_x_forwarded_for here: it prepends the client's own value.
        fastcgi_param HTTP_X_FORWARDED_FOR $client_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_param HTTPS on;
    }

    # Deny hidden files
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive directories
    location ~ ^/(?:app|bootstrap|config|database|resources|routes|vendor) {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
