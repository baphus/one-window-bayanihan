name: Deploy Staging

# Staging deploys automatically once an image for the commit exists in ECR.
# `workflow_run` is used rather than a second `push` trigger so this can never
# run without a verified image: if the build failed, there is nothing to deploy.

on:
  workflow_run:
    workflows: ["Build and Push Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag (commit SHA) to deploy. Use a previous tag to roll back."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # For the automatic path, only proceed when the build actually succeeded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      service_name: bayanihan-staging
      hostname: staging.owbap.app
      app_env: staging
      image_tag: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}
    secrets: inherit
