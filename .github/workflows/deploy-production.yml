name: Deploy Production

# Manual only, by design. Production is never deployed as a side effect of a
# merge: the release order (migrate, then deploy) has to be a decision someone
# takes, and the image being promoted should already have been exercised on
# staging.
#
# Configure the `production` GitHub Environment with required reviewers so this
# cannot run unattended. Without that, "manual" only means "someone clicked".

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag (commit SHA) to promote. Use a previous tag to roll back."
        required: true
        type: string
      confirm:
        description: "Type PRODUCTION to confirm"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm intent
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation phrase
        run: |
          if [ "${{ inputs.confirm }}" != "PRODUCTION" ]; then
            echo "::error::confirmation phrase did not match; expected PRODUCTION"
            exit 1
          fi
          echo "confirmed"

  deploy:
    needs: guard
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      service_name: bayanihan-production
      hostname: r7.owbap.app
      app_env: production
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
